name: Build Windows Installer

on:
  # 可在 Actions 页面手动触发构建
  workflow_dispatch:
  # 推送 v* 标签时自动构建（如 v1.0.0）
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # tfjs-node 4.22 要求 Node >=20.19，且已知 Node 24 下异常，故固定用 20 LTS
          node-version: 20
          cache: npm

      # windows-latest 自带 VS2022 C++ 构建工具与 Python，
      # 可在此直接源码编译 tfjs-node 的 win32-x64 原生绑定
      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npx electron-builder --win --x64
        env:
          # 跳过代码签名（未配置证书）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
