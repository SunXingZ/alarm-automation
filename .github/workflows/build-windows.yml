name: Build Windows Installer

on:
  # 可在 Actions 页面手动触发构建
  workflow_dispatch:
  # 推送 v* 标签时自动构建（如 v1.0.0）
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    # 固定 windows-2022：自带 VS2022，node-gyp 可正常识别；
    # 不能用 windows-latest（其 VS18 太新，node-gyp v10 检测失败）
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 依赖对 Node 版本有硬性要求：electron 44 / puppeteer 25 需要 >=22.12，统一用 22 LTS。
          # 人脸识别已迁移到 onnxruntime-node（N-API，跨 Node/Electron 版本 ABI 稳定），
          # 不再有 tfjs-node 的 tensorflow.dll 版本兼容问题
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_msvs_version: "2022"

      # 人脸识别模型不入库（174MB 超 GitHub 单文件上限），构建时下载
      - name: Download face recognition models
        run: npm run download-models

      # 构建前自检：确认 sharp / onnxruntime-node 两个原生模块在 Windows 上可正常加载
      - name: Verify native modules load
        run: >-
          node -e "require('sharp'); require('onnxruntime-node'); console.log('native modules OK: sharp + onnxruntime-node')"

      - name: Build Windows installer
        # --publish never：只构建，不发布到 GitHub Releases（避免需要 GH_TOKEN）
        run: npx electron-builder --win --x64 --publish never
        env:
          # 跳过代码签名（未配置证书）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # 打包后校验：确认原生 .node 与模型文件被正确解出 asar（否则 Windows 无法加载）
      - name: Verify native files unpacked from asar
        shell: pwsh
        run: |
          $required = @(
            "dist\win-unpacked\resources\app.asar.unpacked\node_modules\onnxruntime-node\bin\napi-v6\win32\x64\onnxruntime_node.dll",
            "dist\win-unpacked\resources\app.asar.unpacked\node_modules\@img\sharp-win32-x64\lib\sharp-win32-x64-0.35.4.node"
          )
          $found = $false
          foreach ($f in $required) {
            if (Test-Path $f) { Write-Host "OK: $f"; if ($f -match "onnxruntime") { $found = $true } }
            else { Write-Host "MISSING: $f"; exit 1 }
          }
          # onnxruntime_node 的实际 .node/.dll 路径可能随版本变化，找不到固定路径时
          # 检查目录内是否有任意 onnxruntime 原生二进制
          if (-not $found) {
            $hit = Get-ChildItem "dist\win-unpacked\resources\app.asar.unpacked\node_modules\onnxruntime-node" -Recurse -Include "*.node","*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { Write-Host "OK (alternate path): $($hit.FullName)" }
            else { Write-Host "MISSING: onnxruntime native binary"; exit 1 }
          }
          # 模型在 asar 内（用 buffer 加载），校验其在包内存在
          $model = "dist\win-unpacked\resources\app.asar"
          if (Test-Path $model) { Write-Host "OK: app.asar exists" }
          else { Write-Host "MISSING: app.asar"; exit 1 }

      # 用 Electron 内置的 Node（与应用完全相同的运行时）实际加载原生模块，
      # 验证打包后的二进制确实可在 Windows 下加载
      - name: Smoke test native modules under Electron runtime
        shell: pwsh
        run: |
          Set-Content -Path smoke.js -Value "const sharp = require('sharp'); const ort = require('onnxruntime-node'); console.log('Electron smoke OK: sharp + onnxruntime-node under electron ' + process.versions.electron); process.exit(0);"
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron smoke.js
          $code = $LASTEXITCODE
          Remove-Item smoke.js -ErrorAction SilentlyContinue
          exit $code

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
