name: Build Windows Installer

on:
  # 可在 Actions 页面手动触发构建
  workflow_dispatch:
  # 推送 v* 标签时自动构建（如 v1.0.0）
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    # 固定 windows-2022：自带 VS2022，node-gyp 可正常识别；
    # 不能用 windows-latest（其 VS18 太新，node-gyp v10 检测失败）
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # tfjs-node 4.22 要求 Node >=20.19，且已知 Node 24 下异常，故固定用 20 LTS
          node-version: 20
          cache: npm

      # windows-2022 自带 VS2022 C++ 构建工具与 Python，
      # 可在此直接源码编译 tfjs-node 的 win32-x64 原生绑定
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_msvs_version: "2022"

      - name: Build Windows installer
        # --publish never：只构建，不发布到 GitHub Releases（避免需要 GH_TOKEN）
        run: npx electron-builder --win --x64 --publish never
        env:
          # 跳过代码签名（未配置证书）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
